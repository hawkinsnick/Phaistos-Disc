name: Validate and publish checked milestone
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-validation.txt
      - run: python scripts/validate_current_state.py
      - run: python scripts/test_foundation.py
      - name: Run available milestone checks
        run: |
          for script in test_analysis.py test_exports.py test_release.py validate_family_readiness.py; do
            if test -f "scripts/$script"; then python "scripts/$script"; fi
          done
  primary-source:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source page renderer
        run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - name: Acquire exact primary source and render public-domain evidence
        run: python scripts/fetch_primary_sources.py --cache /tmp/primary-source --render
      - uses: actions/upload-artifact@v4
        with:
          name: checked-source-images
          path: sources/images/*.png
  browser:
    needs: primary-source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: checked-source-images
          path: sources/images
      - run: npm install --no-save --ignore-scripts playwright@1.62.1
      - run: node scripts/test_workbench.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: workbench-browser-review
          path: output/browser-review/*.png
  publish:
    if: github.event_name == 'push'
    needs: [validate, primary-source, browser]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: checked-source-images
          path: sources/images
      - name: Package and publish immutable milestone
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(cat VERSION)
          tag="v$version"
          latest=false
          if test "$version" = "1.0.0"; then latest=true; fi
          python scripts/package_release.py --out /tmp/disc-release.zip
          python -c "import hashlib,pathlib; p=pathlib.Path('/tmp/disc-release.zip'); pathlib.Path(str(p)+'.sha256').write_text(hashlib.sha256(p.read_bytes()).hexdigest()+'  disc-release.zip\\n')"
          if gh release view "$tag" >/dev/null 2>&1; then
            actual=$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq '.object.sha')
            test "$actual" = "$GITHUB_SHA"
          else
            gh release create "$tag" /tmp/disc-release.zip /tmp/disc-release.zip.sha256 --target "$GITHUB_SHA" --latest="$latest" --title "Phaistos Disc $version" --notes-file "releases/$version.md"
          fi
          if test "$version" = "0.2.0" && ! gh release view v0.1.0 >/dev/null 2>&1; then
            gh release create v0.1.0 --target f29c767e88545f46359d5db2d02c7f930c3ce4aa --latest=false --title "Phaistos Disc 0.1.0" --notes "Historical foundation: one object scaffold, two faces, 45 Unicode base signs plus a combining mark, zero checked transcription records. Source archives are available through this tag."
          fi
