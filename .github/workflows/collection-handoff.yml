name: Collection source work and review handoff
on: [push, pull_request]
permissions:
  contents: write
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebind generated artifact checksums without changing scientific inputs
        if: github.event_name == 'push' && github.ref == 'refs/heads/recovery/collection-handoff-2026-10-09'
        run: |
          python - <<'PY'
          import hashlib, json, pathlib
          p=pathlib.Path('analysis/current-status.json')
          state=json.loads(p.read_text())
          generated={'analysis/evidence-index-v1.json','analysis/workbench-acceptance-v1.json','workbench/evidence.html'}
          seen=set()
          for e in state['evidence']:
            if e['path'] in generated:
              seen.add(e['path'])
              e['sha256']=hashlib.sha256(pathlib.Path(e['path']).read_bytes()).hexdigest()
          if seen!=generated: raise ValueError('missing generated evidence paths')
          p.write_text(json.dumps(state,ensure_ascii=False,indent=2) + chr(10))
          PY
          python scripts/build_collection_handoff.py --write
          git add analysis/current-status.json research/collection-work-ledger.json review/collection-packet.json review/collection-decision-template.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore: rebind generated evidence artifact pins and replay collection ledger'
            git push origin HEAD:recovery/collection-handoff-2026-10-09
          fi
      - run: python scripts/build_collection_handoff.py
      - run: python -m unittest discover -s tests -p 'test_collection_handoff.py'
