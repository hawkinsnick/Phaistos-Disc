name: Collection source work and review handoff
on: [push, pull_request]
permissions:
  contents: write
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild evidence and collection artifacts from verified pinned inputs
        if: github.event_name == 'push' && github.ref == 'refs/heads/recovery/collection-handoff-2026-10-09'
        run: |
          python scripts/build_collection_handoff.py --write
          python - <<'PY'
          import json, pathlib, sys
          sys.path.insert(0, 'scripts')
          from edition_workbench import calculate
          pathlib.Path('analysis/edition-workbench-v1.json').write_text(json.dumps(calculate(), ensure_ascii=False, indent=2) + chr(10))
          PY
          python - <<'PY'
          import hashlib, json, pathlib
          p=pathlib.Path('analysis/current-status.json')
          state=json.loads(p.read_text())
          edition=pathlib.Path('analysis/edition-workbench-v1.json')
          pin=hashlib.sha256(edition.read_bytes()).hexdigest()
          matches=[e for e in state['evidence'] if e['path']=='analysis/edition-workbench-v1.json']
          if len(matches)!=1: raise ValueError('expected exactly one generated edition evidence pin')
          matches[0]['sha256']=pin
          p.write_text(json.dumps(state,ensure_ascii=False,indent=2) + chr(10))
          PY
          python scripts/evidence_workbench.py --write
          git add analysis/current-status.json research/collection-work-ledger.json review/collection-packet.json review/collection-decision-template.json analysis/edition-workbench-v1.json analysis/evidence-index-v1.json analysis/workbench-acceptance-v1.json workbench/evidence.html
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore: replay pinned evidence and collection handoff on recovery branch'
            git push origin HEAD:recovery/collection-handoff-2026-10-09
          fi
      - run: python scripts/build_collection_handoff.py
      - run: python -m unittest discover -s tests -p 'test_collection_handoff.py'
